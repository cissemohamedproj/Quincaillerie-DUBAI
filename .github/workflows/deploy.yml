
name: Deploiement Backend VPS

on:
  push:
    branches:
      - v2_backend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Node.js Backend to Contabo
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure known hosts
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            set -e

            BACKEND_DIR="/home/apps/quincaillerie-dubai/backend"

            echo "Updating backend source code..."
            cd "$BACKEND_DIR"

            git fetch origin
            git checkout v2_backend
            git reset --hard origin/v2_backend

            echo "Installing backend dependencies..."
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            echo "Restarting backend with PM2..."

            if pm2 describe backend-quincaillerie-dubai > /dev/null 2>&1; then
              pm2 restart backend-quincaillerie-dubai --update-env
            else
              pm2 start server.js --name backend-quincaillerie-dubai
            fi

            pm2 save

            echo "Backend deployment completed successfully!"
          REMOTE

      - name: Deployment status
        run: echo "Backend deployed successfully!"
